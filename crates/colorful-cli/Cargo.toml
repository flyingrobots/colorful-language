[package]
name = "colorful-cli"
description = "Colorize English prose by part of speech in the terminal (ANSI)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["prose", "syntax-highlighting", "english", "cli", "color"]
categories = ["command-line-utilities", "text-processing"]
default-run = "colorful"

[lib]
name = "colorful_cli"
path = "src/lib.rs"

[[bin]]
name = "colorful"
path = "src/main.rs"

[dependencies]
colorful-core = { workspace = true }
colorful-parse = { workspace = true }
colorful-lexicon = { workspace = true }
colorful-ir = { workspace = true }
colorful-lint = { workspace = true }
colorful-projection = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
dhat = { workspace = true }
toml = { workspace = true }

# Test-only: the lint golden-fixture harness cross-checks CLI and LSP
# diagnostics for the same input. colorful-lsp does not depend on
# colorful-cli, so this isn't circular.
colorful-lsp = { path = "../colorful-lsp", version = "0.4.0" }
tower-lsp = { workspace = true }

[[bench]]
name = "colorize_bench"
harness = false

[[example]]
name = "cross_stage_benchmark"
path = "examples/cross_stage_benchmark.rs"
test = true

[[example]]
name = "cross_stage_allocations"
path = "examples/cross_stage_allocations.rs"
test = true
