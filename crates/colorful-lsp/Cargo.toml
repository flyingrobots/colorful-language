[package]
name = "colorful-lsp"
description = "Language server emitting part-of-speech semantic tokens for English prose."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["prose", "lsp", "language-server", "english", "highlighting"]
categories = ["text-processing", "development-tools"]
default-run = "colorful-lsp"

[lib]
name = "colorful_lsp"
path = "src/lib.rs"

[[bin]]
name = "colorful-lsp"
path = "src/main.rs"

[[example]]
name = "lsp_envelope"
path = "examples/lsp_envelope.rs"
test = true

[dependencies]
colorful-core = { workspace = true }
colorful-parse = { workspace = true, features = ["markdown"] }
colorful-lexicon = { workspace = true }
colorful-lint = { workspace = true }
colorful-ir = { workspace = true }
ropey = { workspace = true }
tower-lsp = { workspace = true }
tokio = { workspace = true }
dashmap = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
toml = { workspace = true }

[[bench]]
name = "semantic_tokens_bench"
harness = false
