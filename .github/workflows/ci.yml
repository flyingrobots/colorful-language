name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Docs & whitespace
    runs-on: ubuntu-latest
    permissions:
      contents: read # Repository checkout and policy files.
      issues: read # Live issue snapshot reconciliation.
      pull-requests: read # Closing-issue references.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check for trailing whitespace / conflict markers
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
      - name: Check release profile
        run: bash scripts/release-profile-check.sh
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23
        with:
          globs: "**/*.md"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: ".node-version"
      - name: Install repository policy dependencies
        run: npm ci
      - name: Self-test the Node-version checker
        run: bash scripts/check-node-version.test.sh
      - name: Check the exact Node evidence version
        run: bash scripts/check-node-version.sh
      - name: Self-test editor version compatibility
        run: node --test scripts/check-editor-version-policy.test.mjs
      - name: Check editor version compatibility
        run: node scripts/check-editor-version-policy.mjs
      - name: Self-test release distribution policy
        run: node --test scripts/check-release-distribution.test.mjs
      - name: Check release distribution policy
        run: node scripts/check-release-distribution.mjs
      - name: Self-test editor publication verification
        run: node --test scripts/verify-editor-publication.test.mjs
      - name: Self-test the evidence-toolchain checker
        run: node scripts/check-evidence-toolchains.mjs --self-test
      - name: Check evidence-toolchain policy
        run: node scripts/check-evidence-toolchains.mjs
      - name: Self-test property and fuzz policy
        run: node --test scripts/check-property-fuzz-policy.test.mjs
      - name: Check property and fuzz policy
        run: node scripts/check-property-fuzz-policy.mjs
      - name: Self-test dependency-update policy
        run: node --test scripts/check-dependency-update-policy.test.mjs
      - name: Check dependency-update policy
        run: node scripts/check-dependency-update-policy.mjs
      - name: Self-test repository-maintenance policy
        run: node --test scripts/check-repository-maintenance.test.mjs
      - name: Check repository-maintenance policy
        run: node scripts/check-repository-maintenance.mjs
      - name: Self-test coverage policy
        run: node --test scripts/check-coverage-policy.test.mjs
      - name: Self-test public API doctest policy
        run: node --test scripts/check-public-api-doctests.test.mjs
      - name: Check public API doctest policy
        run: node scripts/check-public-api-doctests.mjs
      - name: Self-test roadmap inventory reconciliation
        run: node --test scripts/check-roadmap-inventory.test.mjs
      - name: Check roadmap inventory structure
        run: node scripts/check-roadmap-inventory.mjs
      - name: Reconcile roadmap inventory with live GitHub issues
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: >-
          node scripts/check-roadmap-inventory.mjs
          --live
          --repo "$REPOSITORY"
          --closing-pr "$PULL_REQUEST"
      - name: Self-test the release publish-order checker
        run: node scripts/check-release-publish-order.test.mjs
      - name: Self-test the internal-link checker
        run: node scripts/check-internal-links.mjs --self-test
      - name: Check internal links and anchors
        run: node scripts/check-internal-links.mjs
      - name: Self-test the doc-citation checker
        run: node scripts/check-doc-citations.mjs --self-test
      - name: Check cited file paths exist
        run: node scripts/check-doc-citations.mjs
      - name: Self-test the main ruleset checker
        run: node scripts/check-main-ruleset.test.mjs
      - name: Check the live main ruleset contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-main-ruleset.mjs --allow-redacted-bypass

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: ".node-version"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-mutants@27.0.0
          fallback: none
      - run: node scripts/check-release-publish-order.mjs
      - run: bash scripts/check-rust-source-policy.test.sh
      - run: bash scripts/check-rust-source-policy.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: bash scripts/check-validator-complexity.sh
      - run: cargo test --all --locked
      - run: cargo test --locked -p colorful-cli --test property_boundaries -- --test-threads=1
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --locked --bins -- -D warnings
      - run: cargo check --manifest-path fuzz/Cargo.toml --locked --bins
      - run: cargo test --doc --workspace --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --locked -p colorful-lexicon --no-deps
      - run: bash scripts/check-ir-validator-mutants.sh

  coverage:
    name: Rust coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master
        with:
          toolchain: "1.97.1"
          components: llvm-tools-preview
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: ".node-version"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none
      - name: Install coverage policy dependencies
        run: npm ci
      - name: Prepare coverage output
        run: mkdir -p target/llvm-cov
      - name: Measure workspace coverage
        run: >-
          cargo llvm-cov
          --workspace
          --all-features
          --all-targets
          --locked
          --json
          --summary-only
          --output-path target/llvm-cov/coverage-summary.json
      - name: Render browsable coverage
        run: >-
          cargo llvm-cov report
          --html
          --output-dir target/llvm-cov
      - name: Enforce coverage policy
        run: >-
          node scripts/check-coverage-policy.mjs
          --report target/llvm-cov/coverage-summary.json
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rust-coverage
          path: |
            target/llvm-cov/coverage-summary.json
            target/llvm-cov/html
          retention-days: 14
          if-no-files-found: error

  package:
    name: Cargo package witness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: bash scripts/package-witness.sh

  install-local-smoke:
    name: install-local.sh smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: bash scripts/smoke-test-install-local.sh

  ir-witness:
    name: IR cross-language round-trip witness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: ".node-version"
      - run: npm ci
      - run: bash scripts/ir-witness.sh
      - run: bash scripts/check-independent-consumer.sh
      - name: graft reference consumer coordinate test
        run: node consumers/graft-projection.test.mjs

  pr-size:
    name: PR size (advisory)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Self-test the reporter
        run: bash scripts/pr-size-report.sh --self-test
      - name: Report PR size (informational only, never blocks merge)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/pr-size-report.sh \
            "origin/$BASE_REF" \
            "$HEAD_SHA"

  version-compat-matrix:
    name: Downstream discovery version-compat matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: ".node-version"
      - run: bash scripts/version-compat-matrix.sh

  generated-ir-drift:
    name: Generated IR and vocabulary drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: ".node-version"
      - run: node --test scripts/check-ir-compatibility.test.mjs
      - run: node scripts/check-ir-compatibility.mjs
      - run: bash scripts/check-generated-ir-drift.sh
      - run: bash scripts/check-generated-vocabulary-drift.sh

  closure-contract:
    name: Issue-closure contract
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read # Read PR commits and closing-issue references.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Self-test the checker
        run: bash scripts/check-closure-contract.sh --self-test
      - name: Enforce PR closure contract
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          bash scripts/check-closure-contract.sh \
            --pr "$PULL_REQUEST" \
            --repo "$REPOSITORY"

  editors:
    name: Editor integrations (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: ".node-version"
      - run: npm ci
      - run: node scripts/check-vscode-dependency-policy.test.mjs
      - run: node scripts/check-vscode-dependency-policy.mjs
      - run: npm ci
        working-directory: editors/vscode
      - run: node --test scripts/check-editor-package-smoke.test.mjs
      - run: npm audit --audit-level=high
        working-directory: editors/vscode
      - run: npm run compile
        working-directory: editors/vscode
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master
        with:
          toolchain: "1.97.1"
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo build --manifest-path editors/zed/Cargo.toml --target wasm32-wasip1
      - run: npm run smoke:package
        working-directory: editors/vscode
