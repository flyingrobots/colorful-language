name: Toolchain compatibility (advisory)

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-stable:
    name: Current Rust stable
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --all --locked
      - run: cargo build --manifest-path editors/zed/Cargo.toml --target wasm32-wasip1 --locked

  node-supported:
    name: Supported Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editors/vscode/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: editors/vscode
      - run: npm run compile
        working-directory: editors/vscode
      - run: ./node_modules/.bin/tsc -p witness/tsconfig.json
      - run: node scripts/generate-vocabulary-validators.test.mjs
      - run: node consumers/graft-projection.test.mjs
