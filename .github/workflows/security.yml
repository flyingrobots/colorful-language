name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-dependency-policy:
    name: Rust dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master
        with:
          toolchain: "1.97.1"
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: cargo-deny@0.18.9
          fallback: none
      - name: Self-test all-workspace discovery and invocation
        run: bash scripts/check-rust-dependency-policy.test.sh
      - name: Check locked advisories, licenses, and sources
        run: bash scripts/check-rust-dependency-policy.sh

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          vulnerability-check: true
          license-check: true
          allow-licenses: >-
            0BSD, Apache-2.0, Apache-2.0 WITH LLVM-exception, MIT,
            NCSA, Unicode-3.0, Unlicense, Zlib, Artistic-2.0,
            BlueOak-1.0.0, BSD-2-Clause, BSD-3-Clause, CC-BY-3.0,
            CC0-1.0, ISC, Python-2.0
          # Reviewed development-only packaging tools; exact versions prevent
          # a replacement release from inheriting the exception.
          allow-dependencies-licenses: >-
            pkg:npm/@azu/style-format@1.0.1,
            pkg:npm/@vscode/vsce-sign@2.0.9,
            pkg:npm/@vscode/vsce-sign-alpine-arm64@2.0.6,
            pkg:npm/@vscode/vsce-sign-alpine-x64@2.0.6,
            pkg:npm/@vscode/vsce-sign-darwin-arm64@2.0.6,
            pkg:npm/@vscode/vsce-sign-darwin-x64@2.0.6,
            pkg:npm/@vscode/vsce-sign-linux-arm@2.0.6,
            pkg:npm/@vscode/vsce-sign-linux-arm64@2.0.6,
            pkg:npm/@vscode/vsce-sign-linux-x64@2.0.6,
            pkg:npm/@vscode/vsce-sign-win32-arm64@2.0.6,
            pkg:npm/@vscode/vsce-sign-win32-x64@2.0.6,
            pkg:npm/ovsx@1.0.2,
            pkg:npm/typed-rest-client@1.8.11,
            pkg:npm/xmlbuilder@11.0.1

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read # Read workflow metadata for analysis.
      contents: read
      packages: read # Resolve packages referenced by the analyzed source.
      security-events: write # Upload code-scanning results.
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          category: "/language:${{ matrix.language }}"

  workflow-security:
    name: Workflow security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
      - name: Install repository policy dependencies
        run: npm ci
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: zizmor@1.28.0
          fallback: none
      - name: Self-test workflow-security analysis
        run: node --test scripts/check-workflow-security.test.mjs
      - name: Analyze checked-in workflows
        run: node scripts/check-workflow-security.mjs
