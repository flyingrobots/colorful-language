name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release admission
    runs-on: ubuntu-24.04
    permissions:
      contents: read # Inspect the tag and origin/main without publishing.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release metadata
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          workspace_version="$(
            awk '
              /^\[workspace.package\]$/ { in_package = 1; next }
              /^\[/ { in_package = 0 }
              in_package && /^version = / {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.toml
          )"
          if [ "$workspace_version" != "$version" ]; then
            echo "Workspace version $workspace_version does not match tag $version."
            exit 1
          fi
          grep -F "## [$version]" CHANGELOG.md
          test -f "docs/goalposts/${GITHUB_REF_NAME}/release.md"
          test -f "docs/goalposts/${GITHUB_REF_NAME}/verification.md"

      - name: Verify the tag is on main
        run: |
          set -euo pipefail
          git fetch -q origin main
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is not an ancestor of origin/main; refusing to release."
            exit 1
          fi

  binary-artifacts:
    name: Native binaries (${{ matrix.target }})
    needs: validate-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read # Read the immutable tagged source.
      id-token: write # Request the short-lived Sigstore signing identity.
      attestations: write # Publish provenance for the native archive.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable_suffix: ""
          - runner: macos-15
            target: aarch64-apple-darwin
            executable_suffix: ""
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            executable_suffix: ".exe"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}

      - name: Build native binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          cargo build --release --locked
          --target "$TARGET"
          -p colorful-cli -p colorful-lsp

      - name: Package native binaries
        shell: bash
        env:
          EXECUTABLE_SUFFIX: ${{ matrix.executable_suffix }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          dist_name="colorful-language-${GITHUB_REF_NAME}-${TARGET}"
          archive="${dist_name}.tar.gz"
          mkdir -p "dist/${dist_name}"
          cp \
            "target/${TARGET}/release/colorful${EXECUTABLE_SUFFIX}" \
            "dist/${dist_name}/colorful${EXECUTABLE_SUFFIX}"
          cp \
            "target/${TARGET}/release/colorful-lsp${EXECUTABLE_SUFFIX}" \
            "dist/${dist_name}/colorful-lsp${EXECUTABLE_SUFFIX}"
          cp README.md LICENSE NOTICE CHANGELOG.md "dist/${dist_name}/"
          tar -C dist -czf "dist/${archive}" "${dist_name}"
          if command -v sha256sum >/dev/null 2>&1; then
            (
              cd dist
              sha256sum "${archive}" > "${archive}.sha256"
            )
          else
            (
              cd dist
              shasum -a 256 "${archive}" > "${archive}.sha256"
            )
          fi

      - name: Attest native archive
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/*.tar.gz

      - name: Upload native archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-binaries-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Build and publish release
    needs:
      - validate-release
      - binary-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write # Create the GitHub release after all evidence passes.
      id-token: write # Request the short-lived Sigstore signing identity.
      attestations: write # Publish provenance for editor artifacts.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: ".node-version"
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
          targets: wasm32-wasip1

      - name: Install repository policy dependencies
        run: npm ci

      - name: Install editor publication dependencies
        run: npm --prefix editors/vscode ci

      - name: Check release profile
        run: bash scripts/release-profile-check.sh

      - name: Check editor version compatibility
        run: node scripts/check-editor-version-policy.mjs

      - name: Check release distribution policy
        run: node scripts/check-release-distribution.mjs

      - name: Download native archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-binaries-*
          path: dist
          merge-multiple: true

      # Re-run the Rust build/test gate as a final guard. The full CI gate
      # (IR witness, editor compilation, Markdown, workflow lint) is not repeated
      # here: a tag must be an ancestor of `main` (verified above), where that
      # gate has already passed on the merged commit.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --all --locked
      - run: cargo build --release --locked
      - run: bash scripts/package-witness.sh

      - name: Build and smoke editor packages
        run: |
          set -euo pipefail
          npm --prefix editors/vscode run smoke:package
          version="${GITHUB_REF_NAME#v}"
          vsix="target/editor-smoke/colorful-language-${version}.vsix"
          zed_archive="colorful-language-${GITHUB_REF_NAME}-zed-source.tar.gz"
          test -f "$vsix"
          test -d target/editor-smoke/zed-source
          cp "$vsix" dist/
          tar -C target/editor-smoke -czf "dist/${zed_archive}" zed-source
          (
            cd dist
            sha256sum "$(basename "$vsix")" > "$(basename "$vsix").sha256"
            sha256sum "$zed_archive" > "${zed_archive}.sha256"
          )

      - name: Attest editor artifacts
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            target/editor-smoke/*.vsix
            dist/*zed-source.tar.gz

      - name: Verify and publish editor extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          npm --prefix editors/vscode exec -- vsce verify-pat flyingrobots
          npm --prefix editors/vscode exec -- ovsx verify-pat flyingrobots
          version="${GITHUB_REF_NAME#v}"
          vsix="target/editor-smoke/colorful-language-${version}.vsix"
          npm --prefix editors/vscode exec -- vsce publish --packagePath "$vsix" --skip-duplicate --no-dependencies --no-yarn
          npm --prefix editors/vscode exec -- ovsx publish --packagePath "$vsix" --skip-duplicate --no-dependencies

      - name: Verify published editor bytes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          vsix="target/editor-smoke/colorful-language-${version}.vsix"
          node scripts/verify-editor-publication.mjs \
            --vsix "$vsix" \
            --version "$version"

      # Publish in dependency order. `cargo publish` waits for each crate to land
      # in the index before returning, so dependents resolve. Cargo requires
      # versioned dev-dependencies to resolve from the registry too:
      # colorful-lexicon precedes colorful-parse for numeric parity evidence,
      # and colorful-lsp precedes colorful-cli for lint parity evidence.
      # Neither edge introduces a dependency cycle.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          crate_ready() {
            cargo info --quiet "$1@$version" --registry crates-io >/dev/null
          }
          for crate in colorful-core colorful-lexicon colorful-parse colorful-ir colorful-lint colorful-projection colorful-lsp colorful-cli; do
            echo "::group::publish $crate"
            if crate_ready "$crate"; then
              echo "$crate $version is already available in the crates.io index; verifying and continuing."
              echo "::endgroup::"
              continue
            fi
            cargo publish -p "$crate" --locked
            for attempt in $(seq 1 30); do
              if crate_ready "$crate"; then
                echo "$crate $version is available in the crates.io index."
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "$crate $version did not become available in the crates.io index in time."
                exit 1
              fi
              sleep 10
            done
            echo "::endgroup::"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/goalposts/${GITHUB_REF_NAME}/release.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "colorful-language ${GITHUB_REF_NAME}" \
              --notes-file "$notes" \
              dist/*
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "colorful-language ${GITHUB_REF_NAME}" \
              --generate-notes \
              dist/*
          fi
