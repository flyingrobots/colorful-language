name: Release

# A pushed v* tag publishes. A manual run on main is a dry run: it runs
# admission, the native builds, packaging, and the checks on the assembled
# artifact set, and skips every step guarded by
# `github.event_name == 'push'`: attestation, crates.io publication, GitHub
# Release creation, and the public VSIX check. See docs/RELEASING.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release admission
    runs-on: ubuntu-24.04
    permissions:
      contents: read # Inspect the tag and origin/main without publishing.
    outputs:
      release-tag: ${{ steps.release-metadata.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
          targets: wasm32-wasip1

      - name: Install repository policy dependencies
        run: npm ci

      # A tag run takes its release tag from the pushed tag and must match the
      # workspace. A dry run has no tag, so it derives one from the workspace
      # version, and it runs only on main.
      - name: Verify release metadata
        id: release-metadata
        run: |
          set -euo pipefail
          workspace_version="$(
            awk '
              /^\[workspace.package\]$/ { in_package = 1; next }
              /^\[/ { in_package = 0 }
              in_package && /^version = / {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.toml
          )"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "A release dry run runs only on main; refusing $GITHUB_REF."
            exit 1
          fi
          case "$GITHUB_EVENT_NAME" in
            push) release_tag="$GITHUB_REF_NAME" ;;
            workflow_dispatch) release_tag="v${workspace_version}" ;;
            *) echo "Unsupported release event $GITHUB_EVENT_NAME."; exit 1 ;;
          esac
          version="${release_tag#v}"
          if [ "$workspace_version" != "$version" ]; then
            echo "Workspace version $workspace_version does not match tag $version."
            exit 1
          fi
          grep -F "## [$version]" CHANGELOG.md
          test -f "docs/goalposts/${release_tag}/release.md"
          test -f "docs/goalposts/${release_tag}/verification.md"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Verify the tag is on main
        run: |
          set -euo pipefail
          git fetch -q origin main
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            release_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          else
            release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          fi
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "${GITHUB_REF} at ${release_commit} is not an ancestor of origin/main; refusing to release."
            exit 1
          fi

      - name: Check release profile
        run: bash scripts/release-profile-check.sh

      - name: Self-test release packet policy
        run: node --test scripts/check-release-packet.test.mjs

      - name: Check release packet
        run: node scripts/check-release-packet.mjs

      - name: Check editor version compatibility
        run: node scripts/check-editor-version-policy.mjs

      - name: Check release distribution policy
        run: node scripts/check-release-distribution.mjs

      - name: Self-test Homebrew formula generation
        run: node --test scripts/generate-homebrew-formula.test.mjs

      # The cross-stage benchmark report asserts on `cargo metadata --locked
      # --offline`, in the workspace tests and again in the package witness. It
      # resolves the whole graph including target-gated crates a Linux build
      # never downloads on its own.
      - name: Cache the whole locked dependency graph
        run: cargo fetch --locked

      - name: Validate Rust formatting
        run: cargo fmt --all -- --check

      - name: Validate Rust lints
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Validate Rust tests
        run: cargo test --all --locked

      - name: Validate release build
        run: cargo build --release --locked

      - name: Validate package witness
        run: bash scripts/package-witness.sh

  binary-artifacts:
    name: Native binaries (${{ matrix.target }})
    needs: validate-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ needs.validate-release.outputs.release-tag }}
    # GitHub Actions cannot vary job permissions by event, so a dry run holds
    # the same grant; the only step that uses it is tag-only.
    permissions:
      contents: read # Read the immutable tagged source.
      id-token: write # Request the short-lived Sigstore signing identity.
      attestations: write # Publish provenance for the native archive.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable_suffix: ""
          - runner: macos-15
            target: aarch64-apple-darwin
            executable_suffix: ""
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            executable_suffix: ".exe"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}

      - name: Build native binaries
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: >-
          cargo build --release --locked
          --target "$TARGET"
          -p colorful-cli -p colorful-lsp

      - name: Package native binaries
        shell: bash
        env:
          EXECUTABLE_SUFFIX: ${{ matrix.executable_suffix }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          dist_name="colorful-language-${RELEASE_TAG}-${TARGET}"
          archive="${dist_name}.tar.gz"
          mkdir -p "dist/${dist_name}"
          cp \
            "target/${TARGET}/release/colorful${EXECUTABLE_SUFFIX}" \
            "dist/${dist_name}/colorful${EXECUTABLE_SUFFIX}"
          cp \
            "target/${TARGET}/release/colorful-lsp${EXECUTABLE_SUFFIX}" \
            "dist/${dist_name}/colorful-lsp${EXECUTABLE_SUFFIX}"
          cp README.md LICENSE NOTICE CHANGELOG.md "dist/${dist_name}/"
          tar -C dist -czf "dist/${archive}" "${dist_name}"
          if command -v sha256sum >/dev/null 2>&1; then
            (
              cd dist
              sha256sum "${archive}" > "${archive}.sha256"
            )
          else
            (
              cd dist
              shasum -a 256 "${archive}" > "${archive}.sha256"
            )
          fi

      # Attestation writes a public, permanent provenance record, so a dry run
      # skips it.
      - name: Attest native archive
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Upload native archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Build and publish release
    needs:
      - validate-release
      - binary-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ needs.validate-release.outputs.release-tag }}
    # GitHub Actions cannot vary job permissions by event, so a dry run holds
    # the same grant; every step that uses it is tag-only.
    permissions:
      contents: write # Create the GitHub release after all evidence passes.
      id-token: write # Request the short-lived Sigstore signing identity.
      attestations: write # Publish provenance for editor artifacts.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
          targets: wasm32-wasip1

      - name: Set up formula syntax Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.4.10"

      - name: Install repository policy dependencies
        run: npm ci

      - name: Install editor packaging dependencies
        run: npm --prefix editors/vscode ci

      - name: Download native archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-binaries-*
          path: dist
          merge-multiple: true

      - name: Install SBOM tool
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-cyclonedx@0.5.9
          fallback: none

      # Runs after the native archives land in dist/ so the dependency graph
      # ships beside the bytes it describes, and before the attestation step so
      # the SBOM carries the same provenance as the artifacts it covers.
      - name: Generate SBOM
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --all --manifest-path crates/colorful-cli/Cargo.toml --override-filename sbom
          cargo cyclonedx --format json --all --manifest-path crates/colorful-lsp/Cargo.toml --override-filename sbom
          cp crates/colorful-cli/sbom.json "dist/colorful-language-${RELEASE_TAG}-colorful-sbom.cdx.json"
          cp crates/colorful-lsp/sbom.json "dist/colorful-language-${RELEASE_TAG}-colorful-lsp-sbom.cdx.json"

      - name: Generate Homebrew formula
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          node scripts/generate-homebrew-formula.mjs \
            --version "$version" \
            --dist-dir dist \
            > dist/colorful.rb
          ruby -c dist/colorful.rb

      - name: Build and smoke editor packages
        run: |
          set -euo pipefail
          npm --prefix editors/vscode run smoke:package
          version="${RELEASE_TAG#v}"
          vsix="target/editor-smoke/colorful-language-${version}.vsix"
          zed_archive="colorful-language-${RELEASE_TAG}-zed-source.tar.gz"
          test -f "$vsix"
          test -d target/editor-smoke/zed-source
          cp "$vsix" dist/
          tar -C target/editor-smoke -czf "dist/${zed_archive}" zed-source
          (
            cd dist
            sha256sum "$(basename "$vsix")" > "$(basename "$vsix").sha256"
            sha256sum "$zed_archive" > "${zed_archive}.sha256"
          )

      # Everything from here on has an effect outside the run, so a dry run
      # stops after the assembled artifact set has been built and checked.
      - name: Attest Homebrew and editor artifacts
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.vsix
            dist/*zed-source.tar.gz
            dist/colorful.rb
            dist/*sbom.cdx.json

      # Publish in dependency order. `cargo publish` waits for each crate to land
      # in the index before returning, so dependents resolve. Cargo requires
      # versioned dev-dependencies to resolve from the registry too:
      # colorful-lexicon precedes colorful-parse for numeric parity evidence,
      # and colorful-lsp precedes colorful-cli for lint parity evidence.
      # Neither edge introduces a dependency cycle.
      - name: Publish to crates.io
        if: github.event_name == 'push'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          crate_ready() {
            cargo info --quiet "$1@$version" --registry crates-io >/dev/null
          }
          for crate in colorful-core colorful-lexicon colorful-parse colorful-ir colorful-lint colorful-projection colorful-lsp colorful-cli; do
            echo "::group::publish $crate"
            if crate_ready "$crate"; then
              echo "$crate $version is already available in the crates.io index; verifying and continuing."
              echo "::endgroup::"
              continue
            fi
            cargo publish -p "$crate" --locked
            for attempt in $(seq 1 30); do
              if crate_ready "$crate"; then
                echo "$crate $version is available in the crates.io index."
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "$crate $version did not become available in the crates.io index in time."
                exit 1
              fi
              sleep 10
            done
            echo "::endgroup::"
          done

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/goalposts/${GITHUB_REF_NAME}/release.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "colorful-language ${GITHUB_REF_NAME}" \
              --notes-file "$notes" \
              dist/*
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "colorful-language ${GITHUB_REF_NAME}" \
              --generate-notes \
              dist/*
          fi

      - name: Verify GitHub Release VSIX
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          vsix="target/editor-smoke/colorful-language-${version}.vsix"
          node scripts/verify-editor-publication.mjs \
            --vsix "$vsix" \
            --version "$version"
