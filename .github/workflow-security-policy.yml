version: 1
analyzer:
  name: zizmor
  version: "1.28.0"
invocation:
  persona: auditor
  min_severity: low
  min_confidence: low
  offline: true
  collect: workflows
  strict_collection: true
exceptions:
  - rule: secrets-outside-env
    path: >-
      .github/workflows/release.yml:jobs.release.steps[Publish to
      crates.io].env.CARGO_REGISTRY_TOKEN
    selector: CARGO_REGISTRY_TOKEN
    owner: "@flyingrobots"
    reason: >-
      The current tag release predates a repository-owned GitHub Environment;
      the token is scoped to the one crates.io publication step.
    remove_when: >-
      Deployment ownership and a protected release environment are configured.
  - rule: secrets-outside-env
    path: >-
      .github/workflows/release.yml:jobs.release.steps[Verify and publish VS
      Marketplace extension].env.VSCE_PAT
    selector: VSCE_PAT
    owner: "@flyingrobots"
    reason: >-
      The current tag release predates a repository-owned GitHub Environment;
      the token is scoped to the one Marketplace verification and publication
      step.
    remove_when: >-
      Deployment ownership and a protected release environment are configured.
  - rule: secrets-outside-env
    path: >-
      .github/workflows/release.yml:jobs.release.steps[Verify and publish Open
      VSX extension].env.OVSX_PAT
    selector: OVSX_PAT
    owner: "@flyingrobots"
    reason: >-
      The current tag release predates a repository-owned GitHub Environment;
      the token is scoped to the one Open VSX verification and publication
      step.
    remove_when: >-
      Deployment ownership and a protected release environment are configured.
