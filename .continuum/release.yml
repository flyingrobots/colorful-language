schema: 1
repo:
  name: colorful-language
  owner: flyingrobots
  primary_artifact: cargo-workspace
versioning:
  strategy: fixed
  semver_phase: pre-1.0
  tag_format: "v{version}"
  release_branch_format: "release/v{version}"
  milestone_format: "v{version}"
  editor_adapters:
    strategy: synchronized
    server: colorful-lsp
    compatibility: same-pre-1.0-minor
    prerelease: unsupported
version_sources:
  - path: Cargo.toml
    type: cargo-workspace
    field: workspace.package.version
    required: true
  - path: Cargo.lock
    type: cargo-lock
    field: package.version
    required: true
  - path: editors/vscode/package.json
    type: npm-package
    field: version
    required: true
  - path: editors/vscode/package-lock.json
    type: npm-lock
    field: version-and-root.version
    required: true
  - path: editors/zed/extension.toml
    type: zed-extension
    field: version
    required: true
  - path: editors/zed/Cargo.toml
    type: cargo-package
    field: package.version
    required: true
  - path: editors/zed/Cargo.lock
    type: cargo-lock-package
    field: package[colorful-language-zed].version
    required: true
docs:
  changelog: CHANGELOG.md
  front_door: README.md
  roadmap: ROADMAP.md
  release_runbook: docs/RELEASING.md
  release_packets: docs/goalposts/v{version}/release.md
  release_witness: docs/goalposts/v{version}/verification.md
  architecture:
    - docs/design/
    - docs/topics/ir/architecture.md
  user_docs:
    - docs/topics/
  operator_docs:
    - docs/workflows/
  contributor_docs:
    - CONTRIBUTING.md
    - AGENTS.md
    - docs/DOCUMENTATION_STANDARDS.md
validation:
  profile: bash scripts/release-profile-check.sh
  editor_compatibility: node scripts/check-editor-version-policy.mjs
  prep: bash scripts/release-prep.sh
  preflight: bash scripts/release-preflight.sh v{version}
workflows:
  ci: ci.yml
  release_prep: ci.yml
  autotag: null
  publish: release.yml
publish:
  trigger: tag_push
  manual_dispatch_required: false
  github_release: true
  registries:
    - name: crates.io
      # Dev-dependencies are registry dependencies during publication, so
      # colorful-lexicon must precede colorful-parse (numeric parity evidence)
      # and colorful-lsp must precede colorful-cli (lint parity evidence).
      # Neither edge introduces a dependency cycle.
      packages:
        - colorful-core
        - colorful-lexicon
        - colorful-parse
        - colorful-ir
        - colorful-lint
        - colorful-projection
        - colorful-lsp
        - colorful-cli
      verify: cargo info {crate}@{version}
  artifacts:
    - name: linux-binaries
      platform: x86_64-unknown-linux-gnu
      contents:
        - colorful
        - colorful-lsp
        - README.md
        - LICENSE
        - NOTICE
        - CHANGELOG.md
dist_tags:
  stable: crates.io-default
  prerelease:
    alpha: unsupported
    beta: unsupported
    rc: unsupported
  maintenance: unsupported
issue_axes:
  required:
    - type
    - priority
    - status
    - area
  optional:
    - risk
    - impact
